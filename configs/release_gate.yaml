    fail_severities:
    - critical
    - high
    required:
    - xss_full
    - upload_webshell
    - rce_probe
    - file_download
    - login_policy
    - auth_token_checks
    - soap_checks
    blocked_is_failure: false
  crypto:
    fail_severities:
    - critical
    - high
    required:
    - crypto_inventory
    - secret_scan
    - plaintext_http
    - client_crypto
    blocked_is_failure: false
  component:
    fail_severities:
    - critical
    - high
    required:
    - sbom_collect
    - cve_gate
    blocked_is_failure: false
  middleware:
    fail_severities:
    - critical
    - high
    required:
    - middleware_scan
    blocked_is_failure: true
middleware:
  host: 192.0.2.10
  services:
    mysql:
      port: 22007
      protocol: mysql
    redis:
      port: 22002
      protocol: redis
    rabbitmq:
      port: 5672
      management_port: 15672
      protocol: rabbitmq
    zookeeper:
      port: 2181
      protocol: zookeeper
    icegrid:
      port: 4061
      protocol: tcp
scanners:
  external_enabled: false
